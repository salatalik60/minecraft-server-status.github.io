<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minecraft Sunucu Durumu</title>
  <link rel="icon" href="https://static.thenounproject.com/png/2101005-200.png" />
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #ffffff;
      --accent: #00ff88;
      --box: #1c1c1c;
    }

    [data-theme="light"] {
      --bg: #f0f0f0;
      --text: #000000;
      --accent: #007744;
      --box: #ffffff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 60px 20px;
      transition: 0.4s ease;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
    }

    .fade-in {
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-8px); }
      100% { transform: translateX(0); }
    }

    .credit {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
      opacity: 0.6;
    }

    .top-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .top-buttons select, .top-buttons button {
      margin-left: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .input-box {
      background: var(--box);
      border: 2px solid #444;
      border-radius: 20px;
      padding: 15px 25px;
      width: 300px;
      font-size: 18px;
      color: var(--text);
      outline: none;
      transition: 0.3s ease;
      box-shadow: 0 0 10px var(--accent);
    }

    .input-box:focus {
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px var(--accent);
    }

    button {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00cc6f;
    }

    .status-box {
      margin-top: 30px;
      padding: 20px;
      background: var(--box);
      border-radius: 30px;
      min-width: 320px;
      box-shadow: 0 0 20px var(--accent);
      display: none;
      text-align: center;
    }

    .status-box p {
      margin: 10px 0;
      font-size: 18px;
      white-space: pre-line;
    }

    #loading {
      margin-top: 20px;
      font-size: 16px;
      color: var(--accent);
      display: none;
      transition: opacity 0.3s ease;
    }

    #iconBox img {
      width: 64px;
      height: 64px;
      margin-bottom: 10px;
      border-radius: 12px;
      box-shadow: 0 0 15px var(--accent);
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    #flag {
      width: 40px;
      height: 28px;
      margin-bottom: 10px;
      border-radius: 6px;
      box-shadow: 0 0 8px var(--accent);
      display: block;
      margin-left: auto;
      margin-right: auto;
      object-fit: cover;
    }

    @media (max-width: 500px) {
      .input-box {
        width: 90%;
      }

      .status-box {
        width: 90%;
        font-size: 16px;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="credit" id="credit">salatalik60 tarafından</div>

  <div class="top-buttons">
    <select id="lang">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
    <button onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <h1 id="title" class="fade-in">Sunucu Durumu</h1>

  <input class="input-box fade-in" type="text" id="ip" placeholder="Sunucu IP'sini gir"/>
  <br />
  <button class="fade-in" onclick="checkStatus()"><span id="checkbtn">Durumu Kontrol Et</span></button>

  <p id="loading">⏳ Kontrol ediliyor...</p>

  <div class="status-box fade-in" id="statusBox">
    <img id="flag" alt="Ülke Bayrağı" src="" style="display:none"/>
    <div id="iconBox"></div>
    <p id="result"></p>
    <p id="motd"></p>
    <p id="players"></p>
    <p id="version"></p>
  </div>

  <script>
    const langData = {
      tr: {
        title: "Sunucu Durumu",
        placeholder: "Sunucu IP'sini gir",
        checkbtn: "Durumu Kontrol Et",
        online: "✅ Sunucu Aktif",
        offline: "❌ Sunucu Kapalı",
        players: "Oyuncu Sayısı",
        version: "Sunucu Sürümü",
        notfound: "❌ Böyle bir sunucu bulunamadı.",
        credit: "salatalik60 tarafından",
        loading: "⏳ Kontrol ediliyor..."
      },
      en: {
        title: "Server Status",
        placeholder: "Enter Server IP",
        checkbtn: "Check Status",
        online: "✅ Server is Online",
        offline: "❌ Server is Offline",
        players: "Players Online",
        version: "Server Version",
        notfound: "❌ Server not found.",
        credit: "by salatalik60",
        loading: "⏳ Checking status..."
      },
      de: {
        title: "Serverstatus",
        placeholder: "Server-IP eingeben",
        checkbtn: "Status prüfen",
        online: "✅ Server ist Online",
        offline: "❌ Server ist Offline",
        players: "Spieler Online",
        version: "Server Version",
        notfound: "❌ Server nicht gefunden.",
        credit: "von salatalik60",
        loading: "⏳ Überprüfen..."
      }
    };

    function updateLang() {
      const lang = document.getElementById("lang").value;
      const l = langData[lang];
      document.getElementById("title").innerText = l.title;
      document.getElementById("ip").placeholder = l.placeholder;
      document.getElementById("checkbtn").innerText = l.checkbtn;
      document.getElementById("credit").innerText = l.credit;
      document.getElementById("loading").innerText = l.loading;
    }

    document.getElementById("lang").addEventListener("change", updateLang);
    updateLang();

    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById("themeBtn");
      if (body.dataset.theme === "dark") {
        body.dataset.theme = "light";
        btn.textContent = "☀️";
      } else {
        body.dataset.theme = "dark";
        btn.textContent = "🌙";
      }
    }

    // Flag CDN URL (80px width)
    function getFlagUrl(countryCode) {
      if (!countryCode) return "";
      return `https://flagcdn.com/w80/${countryCode.toLowerCase()}.png`;
    }

    // IP-to-country API endpoint
    async function getCountryCode(hostname) {
      try {
        // Domain kısmını al (örneğin: play.example.com -> example.com)
        let domain = hostname.split('.').slice(-2).join('.');
        // freegeoip.app kullanıyoruz
        const res = await fetch(`https://freegeoip.app/json/${hostname}`);
        if (!res.ok) return null;
        const data = await res.json();
        return data.country_code || null;
      } catch {
        return null;
      }
    }

    async function checkStatus() {
      const ip = document.getElementById("ip").value.trim();
      if (!ip) return alert("Lütfen sunucu IP veya adresi girin.");

      const lang = document.getElementById("lang").value;
      const l = langData[lang];
      const box = document.getElementById("statusBox");
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");
      const players = document.getElementById("players");
      const version = document.getElementById("version");
      const motd = document.getElementById("motd");
      const iconBox = document.getElementById("iconBox");
      const flagImg = document.getElementById("flag");

      box.style.display = "none";
      loading.style.display = "block";

      // 2.5 saniye bekletelim loading'i
      await new Promise(r => setTimeout(r, 2500));

      try {
        const res = await fetch(`https://api.mcsrvstat.us/2/${ip}`);
        const data = await res.json();

        loading.style.display = "none";
        box.style.display = "block";
        box.classList.remove("shake"); void box.offsetWidth;

        if (!data || !data.hostname) {
          result.innerText = l.notfound;
          players.innerText = "";
          version.innerText = "";
          motd.innerText = "";
          flagImg.style.display = "none";
          iconBox.innerHTML = "";
          box.classList.add("shake");
          return;
        }

        if (data.online) {
          // Sunucu ikonu (base64) varsa göster
          if (data.icon) {
            iconBox.innerHTML = `<img src="${data.icon}" alt="Sunucu İkonu" />`;
          } else {
            iconBox.innerHTML = "";
          }

          // Ülke kodunu hostname'den alalım, sonra bayrağı gösterelim
          const countryCode = await getCountryCode(data.hostname);
          if (countryCode) {
            flagImg.src = getFlagUrl(countryCode);
            flagImg.style.display = "block";
          } else {
            flagImg.style.display = "none";
          }

          // Motd'yi temizleyip (format kodlarını sil) gösterelim
          let motdClean = data.motd?.clean?.join('\n') || "";
          
          result.innerText = l.online;
          motd.innerText = motdClean;
          players.innerText = `${l.players}: ${data.players.online}/${data.players.max}`;
          version.innerText = `${l.version}: ${data.version}`;
        } else {
          result.innerText = l.offline;
          players.innerText = "";
          version.innerText = "";
          motd.innerText = "";
          flagImg.style.display = "none";
          iconBox.innerHTML = "";
        }
      } catch {
        loading.style.display = "none";
        box.style.display = "block";
        result.innerText = l.notfound;
        players.innerText = "";
        version.innerText = "";
        motd.innerText = "";
        flagImg.style.display = "none";
        iconBox.innerHTML = "";
        box.classList.remove("shake"); void box.offsetWidth;
        box.classList.add("shake");
      }
    }
  </script>
</body>
</html>
