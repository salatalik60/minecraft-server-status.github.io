<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minecraft Sunucu Durumu</title>
  <link rel="icon" href="https://static.thenounproject.com/png/2101005-200.png" />
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #ffffff;
      --accent: #00ff88;
      --box: #1c1c1c;
    }
    [data-theme="light"] {
      --bg: #f0f0f0;
      --text: #000000;
      --accent: #007744;
      --box: #ffffff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 60px 20px;
      transition: 0.4s ease;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
    }
    .fade-in {
      animation: fadeIn 1s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .shake {
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-8px); }
      100% { transform: translateX(0); }
    }
    .credit {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
      opacity: 0.6;
    }
    .top-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .top-buttons select, .top-buttons button {
      margin-left: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
    }
    .input-box {
      background: var(--box);
      border: 2px solid #444;
      border-radius: 20px;
      padding: 15px 25px;
      width: 300px;
      font-size: 18px;
      color: var(--text);
      outline: none;
      transition: 0.3s ease;
      box-shadow: 0 0 10px var(--accent);
    }
    .input-box:focus {
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px var(--accent);
    }
    button {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #00cc6f;
    }
    .status-box {
      margin-top: 30px;
      padding: 20px;
      background: var(--box);
      border-radius: 30px;
      min-width: 320px;
      box-shadow: 0 0 20px var(--accent);
      display: none;
    }
    .status-box p {
      margin: 10px 0;
      font-size: 18px;
    }
    #loading {
      margin-top: 20px;
      font-size: 16px;
      color: var(--accent);
      display: none;
    }
    @media (max-width: 500px) {
      .input-box {
        width: 90%;
      }
      .status-box {
        width: 90%;
        font-size: 16px;
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="credit" id="credit">salatalik60 tarafından</div>

  <div class="top-buttons">
    <select id="lang">
      <option value="tr">Türkçe</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
    <button onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <h1 id="title" class="fade-in">Sunucu Durumu</h1>

  <input class="input-box fade-in" type="text" id="ip" placeholder="Sunucu IP'sini gir"/>
  <br />
  <button class="fade-in" onclick="checkStatus()"><span id="checkbtn">Durumu Kontrol Et</span></button>

  <p id="loading">⏳ Kontrol ediliyor...</p>

  <div class="status-box fade-in" id="statusBox">
    <p id="result"></p>
    <p id="players"></p>
    <p id="version"></p>
  </div>

  <script>
    const langData = {
      tr: {
        title: "Sunucu Durumu",
        placeholder: "Sunucu IP'sini gir",
        checkbtn: "Durumu Kontrol Et",
        online: "✅ Sunucu Aktif",
        offline: "❌ Sunucu Kapalı",
        players: "Oyuncu Sayısı",
        version: "Sunucu Sürümü",
        notfound: "❌ Böyle bir sunucu bulunamadı.",
        credit: "salatalik60 tarafından",
        loading: "⏳ Kontrol ediliyor..."
      },
      en: {
        title: "Server Status",
        placeholder: "Enter Server IP",
        checkbtn: "Check Status",
        online: "✅ Server is Online",
        offline: "❌ Server is Offline",
        players: "Players Online",
        version: "Server Version",
        notfound: "❌ Server not found.",
        credit: "by salatalik60",
        loading: "⏳ Checking status..."
      },
      de: {
        title: "Serverstatus",
        placeholder: "Server-IP eingeben",
        checkbtn: "Status prüfen",
        online: "✅ Server ist Online",
        offline: "❌ Server ist Offline",
        players: "Spieler Online",
        version: "Server Version",
        notfound: "❌ Server nicht gefunden.",
        credit: "von salatalik60",
        loading: "⏳ Überprüfen..."
      }
    };

    function updateLang() {
      const lang = document.getElementById("lang").value;
      const l = langData[lang];
      document.getElementById("title").innerText = l.title;
      document.getElementById("ip").placeholder = l.placeholder;
      document.getElementById("checkbtn").innerText = l.checkbtn;
      document.getElementById("credit").innerText = l.credit;
      document.getElementById("loading").innerText = l.loading;
    }

    document.getElementById("lang").addEventListener("change", updateLang);
    updateLang();

    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById("themeBtn");
      if (body.dataset.theme === "dark") {
        body.dataset.theme = "light";
        btn.textContent = "☀️";
      } else {
        body.dataset.theme = "dark";
        btn.textContent = "🌙";
      }
    }

    function checkStatus() {
      const ip = document.getElementById("ip").value;
      const lang = document.getElementById("lang").value;
      const l = langData[lang];
      const box = document.getElementById("statusBox");
      const loading = document.getElementById("loading");

      box.style.display = "none";
      loading.style.display = "block";
      document.getElementById("result").innerText = "";
      document.getElementById("players").innerText = "";
      document.getElementById("version").innerText = "";

      const startTime = Date.now();

      fetch(`https://api.mcsrvstat.us/2/${ip}`)
        .then(res => res.json())
        .then(data => {
          const delay = Math.max(1000 - (Date.now() - startTime), 0);
          setTimeout(() => {
            loading.style.display = "none";
            box.style.display = "block";
            box.classList.remove("shake"); void box.offsetWidth;

            if (!data || !data.hostname || data.ip === "127.0.0.1") {
              document.getElementById("result").innerText = l.notfound;
              box.classList.add("shake");
              return;
            }

            const icon = data.icon
              ? `<img src="${data.icon}" style="width:64px;height:64px;border-radius:12px;margin-bottom:10px;">`
              : "";

            if (data.online) {
              document.getElementById("result").innerHTML = `${icon}<br>${l.online}`;
              document.getElementById("players").innerText = `${l.players}: ${data.players.online}/${data.players.max}`;
              document.getElementById("version").innerText = `${l.version}: ${data.version}`;
            } else {
              document.getElementById("result").innerHTML = `${icon}<br>${l.offline}`;
              document.getElementById("players").innerText = "";
              document.getElementById("version").innerText = "";
            }
          }, delay);
        })
        .catch(() => {
          const delay = Math.max(1000 - (Date.now() - startTime), 0);
          setTimeout(() => {
            loading.style.display = "none";
            box.style.display = "block";
            document.getElementById("result").innerText = l.notfound;
            document.getElementById("players").innerText = "";
            document.getElementById("version").innerText = "";
            box.classList.remove("shake"); void box.offsetWidth;
            box.classList.add("shake");
          }, delay);
        });
    }
  </script>
</body>
</html>
