<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minecraft Sunucu Durumu</title>
  <link rel="icon" href="https://static.thenounproject.com/png/2101005-200.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #ffffff;
      --accent: #00ff88;
      --box: rgba(255, 255, 255, 0.03);
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --error: #ff4757;
      --glow: rgba(0, 255, 136, 0.1);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --text: #1e293b;
      --accent: #10b981;
      --box: rgba(0, 0, 0, 0.02);
      --glass: rgba(0, 0, 0, 0.04);
      --border: rgba(0, 0, 0, 0.08);
      --error: #ef4444;
      --glow: rgba(16, 185, 129, 0.1);
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, var(--glow) 0px, transparent 50%),
        radial-gradient(at 100% 0%, var(--glow) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dynamic-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      filter: blur(100px);
      opacity: 0.15;
      transition: background 1s ease;
    }

    .credit {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 14px;
      opacity: 0.6;
      font-weight: 500;
    }

    .top-buttons {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .top-buttons select, .top-buttons button {
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--glass);
      color: var(--text);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container {
      max-width: 650px;
      width: 100%;
      backdrop-filter: blur(20px) saturate(180%);
      background-color: var(--box);
      border-radius: 32px;
      border: 1px solid var(--border);
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      margin-top: 40px;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.6;
      margin-bottom: 32px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      position: relative;
    }

    .input-box {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      flex: 1;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: 0.3s;
    }

    .favorite-btn {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: var(--text);
      opacity: 0.3;
      transition: 0.3s;
    }

    .favorite-btn.active {
      opacity: 1;
      color: #ffb800;
    }

    .toggle-group {
      display: flex;
      background: var(--glass);
      border-radius: 14px;
      padding: 4px;
      border: 1px solid var(--border);
      width: fit-content;
      margin: 0 auto;
    }

    .toggle-btn {
      padding: 8px 18px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: 0.3s;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #000;
    }

    .primary-btn {
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    .status-box {
      margin-top: 32px;
      padding: 24px;
      background: var(--glass);
      border-radius: 24px;
      border: 1px solid var(--border);
      display: none;
      text-align: center;
    }

    .status-box.show {
      display: block;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .info-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--glass);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin: 4px;
      border: 1px solid var(--border);
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 10px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 16px;
    }

    .player-head {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: help;
    }

    .chart-container {
      margin-top: 20px;
      height: 150px;
      width: 100%;
    }

    .hosting-info {
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.7;
    }

    .plugin-list {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }

    .plugin-item {
      font-size: 11px;
      padding: 2px 6px;
      background: var(--glass);
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: var(--bg);
      padding: 30px;
      border-radius: 24px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 90%;
    }

    #qrcode {
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin: 20px auto;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .clear-btn {
      font-size: 11px;
      color: var(--error);
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
    }

    .version-warning {
      color: #ffb800;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    #loading {
      display: none;
      margin-top: 20px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--accent);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 255, 136, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .action-btn {
        padding: 8px 16px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--glass);
        color: var(--text);
        transition: 0.2s;
    }
    .action-btn.qr-btn { background: #6c5ce7; color: white; border: none; }
  </style>
</head>
<body data-theme="dark">
  <div class="dynamic-bg" id="dynamicBg"></div>
  <div class="credit" id="credit">salatalik60 tarafından</div>

  <div class="top-buttons">
    <button onclick="toggleNotifications()" id="notifBtn">🔔</button>
    <select id="lang">
      <option value="tr">TR</option>
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
    <button onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <div class="container">
    <h1 id="title">Sunucu Durumu</h1>
    <p class="subtitle" id="subtitle">Gelişmiş Minecraft sunucu takibi</p>

    <div class="input-group">
      <div class="toggle-group">
        <button class="toggle-btn active" id="javaBtn" onclick="setType('java')">Java</button>
        <button class="toggle-btn" id="bedrockBtn" onclick="setType('bedrock')">Bedrock</button>
      </div>

      <div class="input-row">
        <input class="input-box" type="text" id="ip" placeholder="Sunucu IP'sini gir"/>
        <button class="favorite-btn" id="favBtn" onclick="toggleFavorite()">★</button>
      </div>

      <button class="primary-btn" onclick="checkStatus()">
        <span id="checkbtn">Durumu Kontrol Et</span>
      </button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <span id="loadingText">Kontrol ediliyor...</span>
    </div>

    <div class="status-box" id="statusBox">
      <div id="hostingBadge" class="hosting-info"></div>
      <img id="flag" alt="Ülke Bayrağı" src="" style="display:none"/>
      <div id="iconBox"></div>
      <p id="result"></p>
      <p id="motd"></p>

      <div id="versionArea">
        <p id="version"></p>
        <div id="versionWarning" class="version-warning"></div>
      </div>

      <p id="players"></p>

      <div id="playerList" class="player-grid" style="display:none"></div>
      <div id="pluginList" class="plugin-list" style="display:none"></div>

      <div class="chart-container">
        <canvas id="pingChart"></canvas>
      </div>

      <div class="action-buttons" style="margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <button class="action-btn" onclick="copyIP()">
          <span id="copyBtnText">IP Kopyala</span>
        </button>
        <button class="action-btn" onclick="shareServer()">
          <span id="shareBtnText">Paylaş</span>
        </button>
        <button class="action-btn qr-btn" onclick="showQR()">
          <span>QR Kod</span>
        </button>
      </div>
    </div>

    <div class="auto-refresh" style="margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span id="autoRefreshText">Otomatik Yenile (30s)</span>
      <label class="switch" style="position: relative; display: inline-block; width: 34px; height: 20px;">
        <input type="checkbox" id="autoRefresh" style="opacity: 0; width: 0; height: 0;">
        <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--glass); transition: .4s; border-radius: 20px; border: 1px solid var(--border);"></span>
      </label>
    </div>

    <div class="history-section" id="favSection" style="display:none; margin-top: 32px; text-align: left;">
      <div class="history-title" style="font-size: 14px; font-weight: 700; opacity: 0.5; margin-bottom: 12px; text-transform: uppercase;">Favoriler</div>
      <div class="history-list" id="favList" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
    </div>

    <div class="history-section" id="historySection" style="display:none; margin-top: 32px; text-align: left;">
      <div class="history-header">
        <div class="history-title" id="historyTitle" style="font-size: 14px; font-weight: 700; opacity: 0.5; text-transform: uppercase;">Son Aramalar</div>
        <div class="clear-btn" onclick="clearHistory()">Temizle</div>
      </div>
      <div class="history-list" id="historyList" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
    </div>
  </div>

  <div id="qrModal" class="modal" onclick="closeQR()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>Sunucu QR Kodu</h3>
      <div id="qrcode"></div>
      <button class="primary-btn" onclick="closeQR()">Kapat</button>
    </div>
  </div>

  <script>
    let serverType = 'java';
    let refreshInterval = null;
    let pingChart = null;
    let pingData = [];
    let currentIP = "";
    let wasOnline = null;
    let notificationsEnabled = false;

    const langData = {
      tr: {
        title: "Sunucu Durumu",
        subtitle: "Gelişmiş Minecraft sunucu takibi",
        placeholder: "Sunucu IP'sini gir",
        checkbtn: "Durumu Kontrol Et",
        online: "✅ Sunucu Aktif",
        offline: "❌ Sunucu Kapalı",
        players: "Oyuncu Sayısı",
        version: "Sürüm",
        notfound: "❌ Sunucu bulunamadı.",
        credit: "salatalik60 tarafından",
        loading: "Kontrol ediliyor...",
        copyIp: "IP Kopyala",
        copied: "Kopyalandı!",
        share: "Paylaş",
        history: "Son Aramalar",
        favorites: "Favoriler",
        autoRefresh: "Otomatik Yenile (30s)",
        clear: "Temizle",
        verOutdated: "⚠️ Sunucu sürümü güncel değil!",
        notifEnabled: "Bildirimler açıldı",
        notifDisabled: "Bildirimler kapalı"
      },
      en: {
        title: "Server Status",
        subtitle: "Advanced Minecraft server tracking",
        placeholder: "Enter server IP",
        checkbtn: "Check Status",
        online: "✅ Server is Online",
        offline: "❌ Server is Offline",
        players: "Players",
        version: "Version",
        notfound: "❌ Server not found.",
        credit: "by salatalik60",
        loading: "Checking...",
        copyIp: "Copy IP",
        copied: "Copied!",
        share: "Share",
        history: "Recent Searches",
        favorites: "Favorites",
        autoRefresh: "Auto Refresh (30s)",
        clear: "Clear",
        verOutdated: "⚠️ Server version is outdated!",
        notifEnabled: "Notifications enabled",
        notifDisabled: "Notifications disabled"
      },
      de: {
        title: "Serverstatus",
        subtitle: "Erweitertes Minecraft-Server-Tracking",
        placeholder: "Server-IP eingeben",
        checkbtn: "Status prüfen",
        online: "✅ Server ist Online",
        offline: "❌ Server ist Offline",
        players: "Spieler",
        version: "Version",
        notfound: "❌ Server nicht gefunden.",
        credit: "von salatalik60",
        loading: "Überprüfen...",
        copyIp: "IP Kopieren",
        copied: "Kopiert!",
        share: "Teilen",
        history: "Letzte Suchen",
        favorites: "Favoriten",
        autoRefresh: "Auto-Aktualisierung (30s)",
        clear: "Löschen",
        verOutdated: "⚠️ Serverversion veraltet!",
        notifEnabled: "Benachrichtigungen aktiviert",
        notifDisabled: "Benachrichtigungen deaktiviert"
      }
    };

    function updateLang() {
      const lang = document.getElementById("lang").value;
      const l = langData[lang];
      document.getElementById("title").innerText = l.title;
      document.getElementById("subtitle").innerText = l.subtitle;
      document.getElementById("ip").placeholder = l.placeholder;
      document.getElementById("checkbtn").innerText = l.checkbtn;
      document.getElementById("credit").innerText = l.credit;
      document.getElementById("loadingText").innerText = l.loading;
      document.getElementById("copyBtnText").innerText = l.copyIp;
      document.getElementById("shareBtnText").innerText = l.share;
      document.getElementById("historyTitle").innerText = l.history;
      document.getElementById("autoRefreshText").innerText = l.autoRefresh;
      document.querySelectorAll(".clear-btn").forEach(el => el.innerText = l.clear);
    }

    document.getElementById("lang").addEventListener("change", updateLang);

    function toggleTheme() {
      const body = document.body;
      const btn = document.getElementById("themeBtn");
      if (body.dataset.theme === "dark") {
        body.dataset.theme = "light";
        btn.textContent = "☀️";
      } else {
        body.dataset.theme = "dark";
        btn.textContent = "🌙";
      }
    }

    function setType(type) {
      serverType = type;
      document.getElementById("javaBtn").classList.toggle("active", type === 'java');
      document.getElementById("bedrockBtn").classList.toggle("active", type === 'bedrock');
      checkFavoriteState();
    }

    // --- FAVORITES & HISTORY ---

    function toggleFavorite() {
      const ip = document.getElementById("ip").value.trim();
      if (!ip) return;

      let favorites = JSON.parse(localStorage.getItem('mc_favorites') || '[]');
      const index = favorites.findIndex(f => f.ip === ip && f.type === serverType);

      if (index === -1) {
        favorites.push({ ip, type: serverType });
        document.getElementById("favBtn").classList.add("active");
      } else {
        favorites.splice(index, 1);
        document.getElementById("favBtn").classList.remove("active");
      }

      localStorage.setItem('mc_favorites', JSON.stringify(favorites));
      renderFavorites();
    }

    function checkFavoriteState() {
      const ip = document.getElementById("ip").value.trim();
      const favorites = JSON.parse(localStorage.getItem('mc_favorites') || '[]');
      const isFav = favorites.some(f => f.ip === ip && f.type === serverType);
      document.getElementById("favBtn").classList.toggle("active", isFav);
    }

    document.getElementById("ip").addEventListener("input", checkFavoriteState);

    function renderFavorites() {
      const favorites = JSON.parse(localStorage.getItem('mc_favorites') || '[]');
      const container = document.getElementById("favSection");
      const list = document.getElementById("favList");

      if (favorites.length === 0) {
        container.style.display = "none";
        return;
      }

      container.style.display = "block";
      list.innerHTML = "";
      favorites.forEach(item => {
        const btn = document.createElement("div");
        btn.className = "history-item";
        btn.style.cssText = "background: var(--glass); border: 1px solid var(--border); padding: 6px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s;";
        btn.innerHTML = `⭐ ${item.ip} <span style="opacity:0.5; font-size:10px;">(${item.type})</span>`;
        btn.onclick = () => {
          document.getElementById("ip").value = item.ip;
          setType(item.type);
          checkStatus();
        };
        list.appendChild(btn);
      });
    }

    function saveToHistory(ip, type) {
      let history = JSON.parse(localStorage.getItem('mc_history') || '[]');
      history = history.filter(item => item.ip !== ip || item.type !== type);
      history.unshift({ ip, type });
      history = history.slice(0, 10);
      localStorage.setItem('mc_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('mc_history') || '[]');
      const container = document.getElementById("historySection");
      const list = document.getElementById("historyList");

      if (history.length === 0) {
        container.style.display = "none";
        return;
      }

      container.style.display = "block";
      list.innerHTML = "";
      history.forEach(item => {
        const btn = document.createElement("div");
        btn.className = "history-item";
        btn.style.cssText = "background: var(--glass); border: 1px solid var(--border); padding: 6px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; transition: 0.2s;";
        btn.innerText = `${item.ip} (${item.type})`;
        btn.onclick = () => {
          document.getElementById("ip").value = item.ip;
          setType(item.type);
          checkStatus();
        };
        list.appendChild(btn);
      });
    }

    function clearHistory() {
      localStorage.removeItem('mc_history');
      renderHistory();
    }

    // --- RENDERING & UTILS ---

    async function updateHostingInfo(ip) {
      const badge = document.getElementById("hostingBadge");
      try {
        const res = await fetch(`https://ipapi.co/${ip}/json/`);
        const data = await res.json();
        if (data.org) {
          badge.innerHTML = `📍 ${data.city || ''}, ${data.country_name || ''} | ☁️ ${data.org}`;
        }
      } catch { badge.innerHTML = ""; }
    }

    function toggleNotifications() {
      if (!notificationsEnabled) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            notificationsEnabled = true;
            document.getElementById("notifBtn").innerText = "🔔✅";
            alert(langData[document.getElementById("lang").value].notifEnabled);
          }
        });
      } else {
        notificationsEnabled = false;
        document.getElementById("notifBtn").innerText = "🔔";
      }
    }

    function sendNotification(title, body) {
      if (notificationsEnabled && Notification.permission === "granted") {
        new Notification(title, { body, icon: "https://static.thenounproject.com/png/2101005-200.png" });
      }
    }

    function updateDynamicBg(iconBase64) {
      if (!iconBase64) {
        document.getElementById("dynamicBg").style.background = "transparent";
        return;
      }
      document.getElementById("dynamicBg").style.background = `url(${iconBase64}) center/cover no-repeat`;
    }

    function updatePingChart(newPing) {
      const ctx = document.getElementById('pingChart').getContext('2d');
      pingData.push(newPing);
      if (pingData.length > 20) pingData.shift();

      if (pingChart) {
        pingChart.update();
      } else {
        pingChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: pingData.map((_, i) => i),
            datasets: [{
              label: 'Ping (ms)',
              data: pingData,
              borderColor: '#00ff88',
              backgroundColor: 'rgba(0, 255, 136, 0.1)',
              borderWidth: 2,
              fill: true,
              tension: 0.4,
              pointRadius: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { display: false },
              y: {
                beginAtZero: true,
                grid: { color: 'rgba(255,255,255,0.05)' },
                ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }
              }
            }
          }
        });
      }
    }

    function showQR() {
      const ip = document.getElementById("ip").value.trim();
      if (!ip) return;
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: ip,
        width: 128,
        height: 128,
        colorDark : "#000000",
        colorLight : "#ffffff",
      });
      document.getElementById("qrModal").style.display = "flex";
    }

    function closeQR() {
      document.getElementById("qrModal").style.display = "none";
    }

    async function getLatestVersion() {
      try {
        const res = await fetch('https://launchermeta.mojang.com/mc/game/version_manifest.json');
        const data = await res.json();
        return data.latest.release;
      } catch { return null; }
    }

    function renderPlayers(players) {
      const container = document.getElementById("playerList");
      if (!players || !players.list || players.list.length === 0) {
        container.style.display = "none";
        return;
      }
      container.style.display = "grid";
      container.innerHTML = players.list.map(p => {
        const name = typeof p === 'string' ? p : p.name;
        const uuid = typeof p === 'object' ? p.uuid : name;
        return `<img class="player-head" src="https://mc-heads.net/avatar/${uuid}/32" title="${name}" alt="${name}">`;
      }).join('');
    }

    async function checkStatus() {
      const ip = document.getElementById("ip").value.trim();
      if (!ip) return;
      currentIP = ip;
      const lang = document.getElementById("lang").value;
      const l = langData[lang];
      const box = document.getElementById("statusBox");
      const loading = document.getElementById("loading");
      loading.style.display = "flex";
      box.classList.remove("show");

      try {
        const endpoint = serverType === 'java' ? '2' : 'bedrock/2';
        const start = Date.now();
        const res = await fetch(`https://api.mcsrvstat.us/${endpoint}/${ip}`);
        const data = await res.json();
        const rtt = Date.now() - start;
        loading.style.display = "none";
        box.style.display = "block";
        setTimeout(() => box.classList.add("show"), 10);

        if (data.online) {
          wasOnline = true;
          saveToHistory(ip, serverType);
          updateDynamicBg(data.icon);
          document.getElementById("result").innerText = l.online;
          document.getElementById("result").style.color = "var(--accent)";
          document.getElementById("motd").innerText = data.motd?.clean?.join('\n') || "";
          document.getElementById("players").innerText = `${l.players}: ${data.players.online} / ${data.players.max}`;
          document.getElementById("version").innerText = `${l.version}: ${data.version}`;
          const latest = await getLatestVersion();
          const warn = document.getElementById("versionWarning");
          if (latest && data.version && !data.version.includes(latest) && serverType === 'java') {
            warn.innerText = l.verOutdated + ` (Latest: ${latest})`;
            warn.style.display = "block";
          } else {
            warn.style.display = "none";
          }
          renderPlayers(data.players);
          updatePingChart(rtt);
          updateHostingInfo(ip);
          if (data.icon) {
            document.getElementById("iconBox").innerHTML = `<img src="${data.icon}" style="width:80px; border-radius:16px; margin-bottom:16px;">`;
          }
          if (data.plugins) {
            const plist = document.getElementById("pluginList");
            plist.style.display = "flex";
            plist.innerHTML = data.plugins.names.map(n => `<span class="plugin-item">${n}</span>`).join('');
          }
        } else {
          wasOnline = false;
          document.getElementById("result").innerText = l.offline;
          document.getElementById("result").style.color = "var(--error)";
          ["motd", "players", "version", "playerList", "pluginList"].forEach(id => {
            const el = document.getElementById(id);
            if(el) {
                el.innerText = "";
                if (id.includes('List')) el.style.display = "none";
            }
          });
        }
      } catch (e) {
        loading.style.display = "none";
        document.getElementById("result").innerText = l.notfound;
      }
    }

    async function copyIP() {
      const ip = document.getElementById("ip").value;
      const lang = document.getElementById("lang").value;
      const btnText = document.getElementById("copyBtnText");
      try {
        await navigator.clipboard.writeText(ip);
        btnText.innerText = langData[lang].copied;
        setTimeout(() => btnText.innerText = langData[lang].copyIp, 2000);
      } catch (err) {}
    }

    function shareServer() {
      const ip = document.getElementById("ip").value;
      const url = new URL(window.location.href);
      url.searchParams.set('ip', ip);
      url.searchParams.set('type', serverType);
      if (navigator.share) {
        navigator.share({ title: 'Minecraft Server Status', text: `Check out this Minecraft server: ${ip}`, url: url.toString() });
      } else {
        navigator.clipboard.writeText(url.toString());
        alert(langData[document.getElementById("lang").value].copied);
      }
    }

    document.getElementById("autoRefresh").addEventListener("change", (e) => {
      if (e.target.checked) {
        refreshInterval = setInterval(async () => {
          const oldStatus = wasOnline;
          await checkStatus();
          if (oldStatus === false && wasOnline === true) {
            sendNotification("Sunucu Aktif!", `${currentIP} tekrar çevrimiçi!`);
          }
        }, 30000);
      } else {
        clearInterval(refreshInterval);
      }
    });

    window.onload = () => {
      updateLang();
      renderHistory();
      renderFavorites();
      const params = new URLSearchParams(window.location.search);
      const ip = params.get('ip');
      const type = params.get('type');
      if (ip) {
        document.getElementById("ip").value = ip;
        if (type) setType(type);
        checkStatus();
      }
    };
  </script>
</body>
</html>
